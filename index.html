<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BWTF Field Conditions</title>
  <meta name="description" content="Weather and ocean values for the Surfrider SF Blue Water Task Force Water Sampling Data Sheet, fetched live from public sources.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="logo-bar">
    <img class="logo-bwtf" src="img/bwtf-logo-white.svg" alt="Blue Water Task Force">
  </header>
  <div class="accent"></div>
  <div class="banner top-banner"><h1>Field Conditions</h1></div>

  <main>
    <form id="form" class="panel" autocomplete="off">
      <p class="lede">Pick your site and when you sampled. Copy each value onto the Water Sampling Data Sheet. Tap any value to see it at its source.</p>
      <fieldset>
        <legend>Sites</legend>
        <div id="sites" class="groups"></div>
      </fieldset>

      <fieldset class="when">
        <legend>Sampled at <span class="tz">(San Francisco time)</span></legend>
        <div class="when-row">
          <label>Date <input type="date" id="date" required></label>
          <label>Time <input type="time" id="time" required></label>
          <button type="button" id="now" class="ghost">Now</button>
        </div>
      </fieldset>

      <button type="submit" class="go">Get conditions</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="results"></div>
  </main>

  <footer class="foot">
    <p>Values are fetched live from Open-Meteo, NOAA, and the SF Bar buoy.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
